name: Security Scan Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  gitleaks:
    name: Scan for Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-scan:
    name: Build and Scan Images (Trivy)
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t german-backend:${{ github.sha }} backend/

      - name: Build frontend production image
        run: docker build -f frontend/Dockerfile.prod -t german-frontend:${{ github.sha }} frontend/

      - name: Run Trivy on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: german-backend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: german-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  syft-sbom:
    name: Generate SBOM (Syft)
    runs-on: ubuntu-latest
    needs: trivy-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image for SBOM
        run: docker build -f backend/Dockerfile -t german-backend:${{ github.sha }} backend/

      - name: Build frontend image for SBOM
        run: docker build -f frontend/Dockerfile.prod -t german-frontend:${{ github.sha }} frontend/

      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: german-backend:${{ github.sha }}
          format: cyclonedx-json
          output-file: backend-sbom.json

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: german-frontend:${{ github.sha }}
          format: cyclonedx-json
          output-file: frontend-sbom.json

      - name: Upload SBOMs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            backend-sbom.json
            frontend-sbom.json
          retention-days: 30
